# SPDX-License-Identifier: Apache-2.0
#
# Weekly, grouped updates. The 7-day cooldown matches `exclude-newer = "7 days"` in pyproject.toml:
# we only adopt releases that have been public for a week (CONTRIBUTING.md, Dependencies).

version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      container-images:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      python:
        patterns: ["*"]
